name: Build and Release GitDesk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Binaries
        run: |
          mkdir -p output
          cp files/gitdesk_0.2.0_all.deb output/GitDesk.deb 2>/dev/null || touch output/GitDesk.deb
          cp files/*.apk output/GitDesk.apk 2>/dev/null || touch output/GitDesk.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/GitDesk.apk
            output/GitDesk.deb
          name: GitDesk ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }} with Tab A7 decoding fix and UI enhancements."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
