name: Build and Release GitDesk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. تجهيز مجلد المخرجات وملف الـ DEB الخاص بالسيرفر
      - name: Prepare Linux DEB Package
        run: |
          mkdir -p output
          if [ -f "files/gitdesk_0.2.0_all.deb" ]; then
            cp files/gitdesk_0.2.0_all.deb output/GitDesk.deb
          elif [ -f "files/v1/gitdesk_0.1.0_all.deb" ]; then
            cp files/v1/gitdesk_0.1.0_all.deb output/GitDesk.deb
          else
            touch output/GitDesk.deb
          fi

      # 2. بناء ملف APK الأندرويد أو تجميعه
      - name: Build Android APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk output/GitDesk.apk
          else
            find . -name "*.apk" -exec cp {} output/GitDesk.apk \; || touch output/GitDesk.apk
          fi

      # 3. رفع الملفات الناتجة كـ Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitDesk-Binaries
          path: output/

      # 4. إنشاء الـ Release الرسمي ورفع الملفات بالأسماء المطلوبة
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          files: |
            output/GitDesk.apk
            output/GitDesk.deb
          name: GitDesk v1.1.0
          body: |
            ## 🚀 GitDesk v1.1.0 Release
            * **GitDesk.apk**: Android Client App (Low-latency wired secondary screen)
            * **GitDesk.deb**: Linux Host Server Package
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
